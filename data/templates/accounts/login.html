{% extends 'base.html' %}
{% block title %}Login | AI Career Coach{% endblock %}
{% block content %}<div class="form-card"><h2>Welcome Back</h2><p>Sign in to access your resume and job matches.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<button type="submit" class="btn btn-primary">Login</button></form>
<div class="form-footer"><a href="{% url 'register' %}">Create an account</a></div></div>{% endblock %}

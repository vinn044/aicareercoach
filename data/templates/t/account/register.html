{% extends 'base.html' %}

{% block title %}Register | UTRGV{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Create Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <div class="form-footer">
        Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </div>
</div>
{% endblock %}
